function exportBackup(){
  if(!state) return;
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `quaderno-regia-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup scaricato');
}
let pendingImport = null;
function handleImportFile(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      pendingImport = migrate(JSON.parse(e.target.result));
      openSheet(`${sheetHead('Importare il backup?')}<p class="sub" style="font-size:15px">I dati attuali vengono sostituiti da quelli del file (${Object.keys(pendingImport.labs).length} laboratori, ${pendingImport.exercises.length} esercizi).</p>
        <div class="sheet-actions"><button class="btn secondary" onclick="closeSheet()">Annulla</button><button class="btn" onclick="state=pendingImport; pendingImport=null; persist(); viewingLabId=null; closeSheet(); toast('Backup importato');">Importa</button></div>`);
    }catch(err){ toast('Questo file non è un backup del Quaderno'); }
    input.value = '';
  };
  r.readAsText(f);
}

/* ============================================================
   GATE: CARICAMENTO / LOGIN
   ============================================================ */
function renderLoading(){ V().innerHTML = `<div class="empty" style="padding-top:80px">Caricamento…</div>`; }
function renderLoginGate(){
  V().innerHTML = `<div class="gate">
    <h1 class="h1" style="margin-bottom:6px">Bentornato</h1>
    <p class="sub" style="font-size:15px;margin-bottom:22px">Accedi con la tua email e password. Su questo dispositivo te lo chiedo una volta sola.</p>
    <form class="card card-pad" onsubmit="doLogin(event)">
      <div class="auth-msg" id="authMsg"></div>
      <div class="field"><label>Email</label><input id="aEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit">Accedi</button>
      <div style="text-align:center;margin-top:10px"><button type="button" class="link-btn" onclick="doReset()">Password dimenticata?</button></div>
    </form>
  </div>`;
}
function authMsg(text, ok){ const el = document.getElementById('authMsg'); if(el){ el.textContent = text; el.classList.toggle('ok', !!ok); } }
function authErr(e){
  const m = { 'auth/invalid-email':'Email non valida.', 'auth/wrong-password':'Password errata.', 'auth/user-not-found':'Nessun account con questa email.',
    'auth/invalid-credential':'Email o password non corrette.', 'auth/network-request-failed':'Nessuna connessione. Riprova.', 'auth/too-many-requests':'Troppi tentativi, riprova tra qualche minuto.' };
  return m[e.code] || ('Errore: ' + (e.message || e.code));
}
async function doLogin(e){
  e.preventDefault();
  try{ await fbAuth.signInWithEmailAndPassword(document.getElementById('aEmail').value.trim().toLowerCase(), document.getElementById('aPass').value); }
  catch(err){ authMsg(authErr(err)); }
}
async function doReset(){
  const email = document.getElementById('aEmail').value.trim();
  if(!email){ authMsg('Scrivi la tua email, poi tocca di nuovo “Password dimenticata?”.'); return; }
  try{ await fbAuth.sendPasswordResetEmail(email); authMsg('Ti ho mandato una email per reimpostare la password.', true); }
  catch(err){ authMsg(authErr(err)); }
}
function renderDeniedGate(){
  showChrome(false);
  V().innerHTML = `<div class="gate card card-pad"><h2 class="h2">Accesso non consentito</h2>
    <p class="sub" style="font-size:15px">Il database non permette a ${esc(fbUser?.email || 'questo account')} di leggere i dati. Controlla le regole di Firestore.</p>
    <button class="btn secondary" onclick="fbAuth.signOut()">Esci</button></div>`;
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2600);
}

init();
</script>

</html>
